<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2933; --muted: #5f6b7a; --line: #d9dee5; --grid: #e6e9ee;
    --head: #eef2f7; --accent: #1a5fb4; --accent-ink: #ffffff; --input: #f3f8ff; --input-line: #b9cde8;
    --calc: #f7f7f7; --good: #1e7b34; --good-bg: #e5f4e8; --bad: #b42318; --bad-bg: #fdeceb;
    --warn: #8a5a00; --warn-bg: #fff4d6; --ovr: #5b3fa6; --ovr-bg: #efe9fb; --closed-bg: #eceff3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 5px 10px; color: var(--ink); }
  button:hover { background: #f0f3f7; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.danger { color: var(--bad); border-color: #e7b4ae; }
  button.link { border: 0; background: none; color: var(--accent); padding: 0 2px; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .topbar h1 { font-size: 16px; margin: 0; }
  .topbar .spacer { flex: 1; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: var(--head); color: var(--muted); }
  .pill.dirty { background: var(--warn-bg); color: var(--warn); }
  .tabs { display: flex; gap: 2px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 10px 14px; background: none; color: var(--muted); white-space: nowrap; }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  main { padding: 12px 16px 60px; }
  .page { display: none; }
  .page.active { display: block; }
  .banner { margin: 10px 16px 0; padding: 8px 12px; border-radius: 4px; font-size: 12.5px; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #f0d58a; }
  .banner.err { background: var(--bad-bg); color: var(--bad); border: 1px solid #f1b5ae; }
  .banner.info { background: #eef4fc; color: #2b4c7e; border: 1px solid #cddcf2; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  h3 { font-size: 13.5px; margin: 14px 0 6px; }
  .note { color: var(--muted); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .card .k { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .02em; }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card .s { color: var(--muted); font-size: 12px; }
  .card.bad .v { color: var(--bad); } .card.good .v { color: var(--good); } .card.warn .v { color: var(--warn); }
  .toolbar { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .tablewrap { overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; max-width: 100%; }
  table.grid { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.grid th, table.grid td { border: 1px solid var(--grid); padding: 3px 6px; white-space: nowrap; text-align: right; vertical-align: middle; }
  table.grid th { background: var(--head); font-weight: 600; font-size: 11.5px; position: sticky; top: 0; z-index: 1; text-align: center; white-space: normal; min-width: 54px; }
  table.grid td.l, table.grid th.l { text-align: left; }
  table.grid td.calc { background: var(--calc); }
  table.grid tr.sel td { box-shadow: inset 0 0 0 9999px rgba(26, 95, 180, .06); }
  table.grid tr.closed td { color: #8a94a3; }
  table.grid tr.excluded td { text-decoration: line-through; text-decoration-color: #b8c0cc; }
  table.grid tr.total td { background: var(--head); font-weight: 600; }
  table.grid input[type=text], table.grid select { width: 100%; min-width: 52px; border: 1px solid transparent; background: var(--input); padding: 2px 4px; font: inherit; text-align: right; border-radius: 2px; }
  table.grid input.name { text-align: left; min-width: 150px; }
  table.grid input[type=text]:focus, table.grid select:focus { outline: none; border-color: var(--accent); background: #fff; }
  table.grid select { text-align: left; min-width: 88px; }
  input.bad, select.bad, textarea.bad { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
  .st { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11.5px; font-weight: 600; }
  .st-met { background: var(--good-bg); color: var(--good); }
  .st-gap { background: var(--bad-bg); color: var(--bad); }
  .st-data { background: var(--warn-bg); color: var(--warn); }
  .st-ovr { background: var(--ovr-bg); color: var(--ovr); }
  .st-closed { background: var(--closed-bg); color: var(--muted); }
  .neg { color: var(--bad); } .pos { color: var(--good); }
  .dr { color: var(--warn); font-weight: 600; }
  .detail { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .detail h3:first-child { margin-top: 0; }
  .form { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 16px; }
  .form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .form label.chk { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); }
  .form input[type=text], .form select, .form textarea, .form input[type=month] { font: inherit; color: var(--ink); padding: 5px 7px; border: 1px solid var(--input-line); background: var(--input); border-radius: 3px; }
  .form textarea { min-height: 54px; resize: vertical; }
  .form .help { font-size: 11px; color: var(--muted); }
  .days { display: flex; gap: 8px; flex-wrap: wrap; color: var(--ink); }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .cols2 { grid-template-columns: 1fr; } }
  ul.lines { margin: 4px 0; padding-left: 18px; }
  ul.lines li { margin: 2px 0; }
  .issues li.error { color: var(--bad); } .issues li.warning { color: var(--warn); }
  .modal-bg { position: fixed; inset: 0; background: rgba(20, 30, 45, .35); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 8px; padding: 16px 18px; width: min(460px, 92vw); box-shadow: 0 10px 30px rgba(0, 0, 0, .2); }
  .modal h3 { margin-top: 0; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #25303d; color: #fff; padding: 8px 14px; border-radius: 4px; display: none; z-index: 60; max-width: 90vw; }
  .toast.show { display: block; }
  .loading { padding: 40px; text-align: center; color: var(--muted); }
  .explain { background: #f9fafb; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font-size: 12px; }
</style>
